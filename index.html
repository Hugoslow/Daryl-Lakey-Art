<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daryl Lakey Art | Original Oil Landscape Paintings</title>
    <meta name="description" content="Original oil landscape paintings by Daryl Lakey. Capturing the beauty of the British countryside and Yorkshire landscapes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Qwitcher+Grypen:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --navy: #1a237e;
            --navy-light: #283593;
            --navy-dark: #0d1642;
            --gold: #c9a84c;
            --gold-light: #dbc278;
            --cream: #faf8f5;
            --white: #ffffff;
            --gray-100: #f5f5f5;
            --gray-200: #eeeeee;
            --gray-300: #e0e0e0;
            --gray-600: #757575;
            --gray-800: #424242;
            --gray-900: #212121;
            --font-script: 'Qwitcher Grypen', cursive;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Outfit', sans-serif;
        }

        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--font-sans);
            color: var(--gray-900);
            background: var(--cream);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== NAVIGATION ===== */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(26, 35, 126, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            transition: all 0.3s ease;
        }
        .nav.scrolled {
            background: rgba(13, 22, 66, 0.98);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        .nav-inner {
            max-width: 100%;
            margin: 0;
            padding: 0 24px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 120px;
        }
        .nav-logo {
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .nav-logo-img {
            height: 120px;
            width: auto;
        }
        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            align-items: center;
        }
        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }
        .cart-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--white);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-btn:hover { border-color: var(--gold); color: var(--gold); }
        .cart-count {
            background: var(--gold);
            color: var(--navy-dark);
            font-size: 0.7rem;
            font-weight: 600;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            width: 24px;
            height: 2px;
            background: var(--white);
            transition: all 0.3s;
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--navy-dark);
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background: url("images/painting-8.png") center/cover no-repeat;
            opacity: 1;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13,22,66,0.15) 0%, rgba(13,22,66,0.1) 40%, rgba(13,22,66,0.7) 85%, rgba(13,22,66,0.95) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-logo {
            max-width: 360px;
            width: 80%;
            height: auto;
            margin-bottom: 24px;
        }
        .hero-subtitle {
            font-family: var(--font-serif);
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: var(--gold);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 32px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .hero-desc {
            font-family: var(--font-sans);
            font-size: 1.05rem;
            color: rgba(255,255,255,0.9);
            max-width: 540px;
            margin: 0 auto 40px;
            font-weight: 300;
            line-height: 1.7;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .hero-cta {
            display: inline-block;
            padding: 14px 40px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.4s;
        }
        .hero-cta:hover {
            background: var(--gold);
            color: var(--navy-dark);
        }
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }
        .scroll-indicator span {
            display: block;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            margin: 0 auto;
            animation: scrollPulse 2s infinite;
        }
        @keyframes scrollPulse {
            0%, 100% { opacity: 1; transform: scaleY(1); }
            50% { opacity: 0.3; transform: scaleY(0.6); }
        }

        /* ===== SECTION BANNER ===== */
        .section-banner {
            height: 200px;
            position: relative;
            overflow: hidden;
        }
        .section-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .section-banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13,22,66,0.5) 0%, rgba(26,35,126,0.7) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section-banner-title {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--white);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ===== ABOUT ===== */
        .about {
            padding: 80px 24px;
            background: var(--white);
        }
        .about-inner {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .about-inner-wide {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 60px;
            align-items: center;
        }
        .about-photo-col {
            display: flex;
            justify-content: center;
        }
        .about-photo {
            width: 100%;
            max-width: 380px;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15);
            object-fit: cover;
        }
        .about-text-col {
            text-align: left;
        }
        .section-label {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
            font-weight: 500;
        }
        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 300;
            color: var(--navy);
            margin-bottom: 32px;
            line-height: 1.3;
        }
        .about-text {
            font-size: 1rem;
            color: var(--gray-600);
            line-height: 1.8;
            font-weight: 300;
        }
        .about-text p + p { margin-top: 16px; }

        /* ===== GALLERY ===== */
        .gallery {
            padding: 80px 24px;
            background: var(--cream);
        }
        .gallery-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .gallery-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
        }
        .painting-card {
            background: var(--white);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            transition: all 0.4s ease;
        }
        .painting-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .painting-image-wrap {
            padding: 24px 24px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-100);
            min-height: 240px;
            position: relative;
            overflow: hidden;
        }
        .painting-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        /* ===== SOLD BANNER ===== */
        .sold-banner {
            position: absolute;
            top: 28px;
            right: -40px;
            background: #c62828;
            color: white;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 8px 50px;
            transform: rotate(45deg);
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .painting-card.sold .painting-img {
            opacity: 0.5;
        }
        .painting-card.sold .btn-cart {
            background: var(--gray-300);
            color: var(--gray-600);
            cursor: default;
            pointer-events: none;
        }

        /* ===== WATERMARK OVERLAY ===== */
        .painting-image-wrap::after,
        .modal-image-wrap::after {
            content: 'Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art';
            position: absolute;
            inset: -50%;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            font-family: var(--font-sans);
            font-size: 1rem;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.08);
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 4;
            line-height: 4;
            word-spacing: 2em;
            white-space: normal;
            overflow: hidden;
        }
        img.painting-img,
        .modal-image-wrap img {
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }

        /* ===== ZOOM VIEWER ===== */
        .zoom-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0,0,0,0.95);
            cursor: grab;
            overflow: hidden;
        }
        .zoom-viewer.active { display: block; }
        .zoom-viewer:active { cursor: grabbing; }
        .zoom-viewer img {
            position: absolute;
            max-width: none;
            transform-origin: 0 0;
            -webkit-user-drag: none;
            user-select: none;
        }
        .zoom-viewer::after {
            content: 'Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art    Daryl Lakey Art';
            position: absolute;
            inset: -100%;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            font-family: var(--font-sans);
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.06);
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 4001;
            line-height: 4;
            word-spacing: 2em;
            white-space: normal;
            overflow: hidden;
        }
        .zoom-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 4002;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .zoom-close:hover { background: rgba(255,255,255,0.3); }
        .zoom-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: var(--font-sans);
            font-size: 0.8rem;
            z-index: 4002;
            letter-spacing: 0.1em;
            pointer-events: none;
        }
        .zoom-in-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: white;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: auto;
        }
        .painting-image-wrap:hover .zoom-in-btn,
        .modal-image-wrap:hover .zoom-in-btn { opacity: 1; }

        .painting-info {
            padding: 24px;
        }
        .painting-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .painting-size {
            font-size: 0.82rem;
            color: var(--gray-600);
            font-weight: 300;
            margin-bottom: 12px;
        }
        .painting-price {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 16px;
        }
        .painting-actions {
            display: flex;
            gap: 8px;
        }
        .btn-view, .btn-cart {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 3px;
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-view {
            background: transparent;
            border: 1px solid var(--navy);
            color: var(--navy);
        }
        .btn-view:hover { background: var(--navy); color: var(--white); }
        .btn-cart {
            background: var(--navy);
            color: var(--white);
        }
        .btn-cart:hover { background: var(--navy-light); }

        /* ===== MODAL ===== */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .modal-backdrop.active { display: flex; }
        .modal {
            background: var(--white);
            border-radius: 6px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border: none;
            background: var(--navy);
            color: var(--white);
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .modal-close:hover { background: var(--gold); color: var(--navy-dark); }
        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
        .modal-image-wrap {
            background: var(--gray-100);
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .modal-image-wrap img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            filter: drop-shadow(0 6px 20px rgba(0,0,0,0.35));
        }
        .modal-sold-banner {
            position: absolute;
            top: 40px;
            right: -50px;
            background: #c62828;
            color: white;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 10px 60px;
            transform: rotate(45deg);
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .modal-details {
            padding: 48px 40px;
        }
        .modal-details h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            color: var(--navy);
            margin-bottom: 8px;
        }
        .modal-details .modal-size {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-bottom: 8px;
        }
        .modal-details .modal-medium {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 20px;
        }
        .modal-details .modal-price {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 20px;
        }
        .modal-details .modal-desc {
            font-size: 0.95rem;
            color: var(--gray-600);
            line-height: 1.7;
            font-weight: 300;
            margin-bottom: 32px;
        }
        .modal-add-cart {
            width: 100%;
            padding: 14px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }
        .modal-add-cart:hover { background: var(--navy-light); }
        .modal-add-cart.sold-btn {
            background: var(--gray-300);
            color: var(--gray-600);
            cursor: default;
            pointer-events: none;
        }

        /* ===== CART SIDEBAR ===== */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: var(--white);
            z-index: 3000;
            box-shadow: -8px 0 40px rgba(0,0,0,0.2);
            transition: right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
        }
        .cart-sidebar.open { right: 0; }
        .cart-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2999;
        }
        .cart-overlay.active { display: block; }
        .cart-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cart-header h3 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--navy);
        }
        .cart-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-600);
            padding: 4px;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
        }
        .cart-empty {
            text-align: center;
            padding: 60px 0;
            color: var(--gray-600);
            font-weight: 300;
        }
        .cart-item {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--gray-200);
            align-items: center;
        }
        .cart-item-img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }
        .cart-item-info { flex: 1; }
        .cart-item-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .cart-item-price {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 500;
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--gray-600);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }
        .cart-item-remove:hover { color: #c62828; }
        .cart-footer {
            padding: 24px;
            border-top: 1px solid var(--gray-200);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .cart-total-label {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--gray-800);
        }
        .cart-total-amount {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 600;
        }
        .cart-checkout-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--navy-dark);
            border: none;
            border-radius: 4px;

            font-weight: 500;

            text-transform: uppercase;

        .form-group input,
        .form-group textarea,
        .form-group select {

        /* ===== FOOTER ===== */
        .site-footer {
            background: var(--navy-dark);
            color: rgba(255,255,255,0.6);
            padding: 60px 24px 32px;
        }
        .footer-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 48px;
        }
        .footer-logo-img {
            height: 60px;
            width: auto;
            margin-bottom: 16px;
        }
        .footer-brand p {
            font-size: 0.9rem;
            line-height: 1.7;
            font-weight: 300;
        }
        .footer-col h4 {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--white);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 400;
        }
        .footer-col a {
            display: block;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.88rem;
            margin-bottom: 8px;
            font-weight: 300;
            transition: color 0.3s;
        }
        .footer-col a:hover { color: var(--gold); }
        .footer-bottom {
            max-width: 1000px;
            margin: 40px auto 0;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 300;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--navy);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 0.9rem;
            z-index: 5000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .about-inner-wide { grid-template-columns: 1fr; gap: 32px; }
            .about-photo { max-width: 280px; }
            .about-text-col { text-align: center; }
            .about-text-col .section-title { text-align: center !important; }
            .about-text-col .about-text { text-align: center !important; }
            .nav-links { display: none; }
            .nav-links.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 120px;
                left: 0;
                right: 0;
                background: var(--navy-dark);
                padding: 24px;
                gap: 20px;
            }
            .hamburger { display: flex; }
            .gallery-grid { grid-template-columns: 1fr; gap: 32px; }
            .modal-body { grid-template-columns: 1fr; }

            .modal-details { padding: 24px; }

            .form-row { grid-template-columns: 1fr; }
            .section-banner { height: 140px; }
        }
        @media (max-width: 480px) {
            .painting-actions { flex-direction: column; }
        }

</head>
<body>

    <!-- NAVIGATION -->
    <nav class="nav" id="mainNav">
        <div class="nav-inner">
            <a href="#" class="nav-logo"><img src="images/logo.png" alt="Daryl Lakey Art" class="nav-logo-img"></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#about">About</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#commissions">Commissions</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="cart-btn" onclick="toggleCart()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="m1 1 4 0 2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                Cart <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="hamburger" id="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <img src="images/logo.png" alt="Daryl Lakey Art" class="hero-logo">
            <p class="hero-subtitle" id="heroSubtitle"></p>
            <p class="hero-desc" id="heroDesc"></p>
            <a href="#gallery" class="hero-cta" id="heroCta"></a>
        </div>
        <div class="scroll-indicator"><span></span></div>
    </section>

    <!-- ABOUT -->
    <section class="about" id="about">
        <div class="about-inner-wide">
            <div class="about-photo-col">
                <img src="images/artist.png" alt="Daryl Lakey, artist" class="about-photo">
            </div>
            <div class="about-text-col">
                <p class="section-label" id="aboutLabel"></p>
                <h2 class="section-title" style="text-align:left;" id="aboutTitle"></h2>
                <div class="about-text" style="text-align:left;" id="aboutText"></div>
            </div>
        </div>
    </section>

    <!-- BANNER 1 -->
    <div class="section-banner">
        <img src="images/painting-5.png" alt="Landscape banner">
        <div class="section-banner-overlay">
            <h2 class="section-banner-title">Available Works</h2>
        </div>
    </div>

    <!-- GALLERY -->
    <section class="gallery" id="gallery">
        <div class="gallery-header">
            <p class="section-label" id="galleryLabel"></p>
            <h2 class="section-title" id="galleryTitle"></h2>
        </div>
        <div class="gallery-grid" id="galleryGrid">
            <!-- Paintings are loaded dynamically from paintings.js -->
        </div>
    </section>

    <!-- BANNER 2 -->
    <div class="section-banner">
        <img src="images/painting-9.png" alt="Landscape banner">
        <div class="section-banner-overlay">
            <h2 class="section-banner-title">Commission a Painting</h2>
        </div>
    </div>

    <!-- COMMISSIONS -->
    <section class="commissions" id="commissions">
        <div class="commissions-inner">
            <div class="commissions-header">
                <p class="section-label" id="commLabel"></p>
                <h2 class="section-title" id="commTitle"></h2>
                <p style="color: var(--gray-600); font-weight: 300; max-width: 500px; margin: 0 auto;" id="commDesc"></p>
            </div>
            <form id="commissionForm" onsubmit="handleCommission(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="commName">Name</label>
                        <input type="text" id="commName" required placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label for="commEmail">Email</label>
                        <input type="email" id="commEmail" required placeholder="your@email.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="commPhone">Phone</label>
                        <input type="tel" id="commPhone" placeholder="Optional">
                    </div>
                    <div class="form-group">
                        <label for="commSize">Preferred Size</label>
                        <select id="commSize">
                            <option value="">Select a size...</option>
                            <option>Small (up to 12" × 10")</option>
                            <option>Medium (up to 20" × 16")</option>
                            <option>Large (up to 30" × 24")</option>

                    <label for="commDetails">Tell me about your vision</label>
                    <textarea id="commDetails" required placeholder="Describe the scene, location, mood, or any reference photos you have..."></textarea>
                </div>
                <button type="submit" class="form-submit">Send Enquiry</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer" id="contact">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="images/logo.png" alt="Daryl Lakey Art" class="footer-logo-img">
                <p id="footerDesc"></p>
            </div>
            <div class="footer-col">
                <h4>Navigate</h4>
                <a href="#about">About</a>
                <a href="#gallery">Gallery</a>
                <a href="#commissions">Commissions</a>
                <a href="#contact">Contact</a>
            </div>
            <div class="footer-col" id="footerConnect">
                <h4>Connect</h4>
            </div>
        </div>
        <div class="footer-bottom" id="footerBottom"></div>
    </footer>

    <!-- MODAL -->
    <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <div class="modal-body">
                <div class="modal-image-wrap" id="modalImageWrap">
                    <button class="zoom-in-btn" id="modalZoomBtn" style="opacity:1;" title="Zoom in">&#x1F50D;</button>
                    <img id="modalImg" src="" alt="">
                </div>
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <p class="modal-size" id="modalSize"></p>
                    <p class="modal-medium" id="modalMedium"></p>
                    <p class="modal-price" id="modalPrice"></p>
                    <p class="modal-desc" id="modalDesc"></p>
                    <button class="modal-add-cart" id="modalCartBtn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CART SIDEBAR -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="cart-empty">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span class="cart-total-label">Total</span>
                <span class="cart-total-amount" id="cartTotal">£0</span>
            </div>
            <button class="cart-checkout-btn" id="checkoutBtn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ZOOM VIEWER -->
    <div class="zoom-viewer" id="zoomViewer">
        <button class="zoom-close" onclick="closeZoom()">&times;</button>
        <img id="zoomImg" src="" alt="">
        <div class="zoom-hint">Scroll to zoom • Drag to pan</div>
    </div>

    <!-- LOAD CONFIG FILES -->
    <script src="paintings.js"></script>
    <script src="siteinfo.js"></script>

    <script>
    // ===== POPULATE SITE FROM siteinfo.js =====
    document.getElementById('heroSubtitle').textContent = siteInfo.heroSubtitle;
    document.getElementById('heroDesc').textContent = siteInfo.heroDescription;
    document.getElementById('heroCta').textContent = siteInfo.heroButtonText;
    document.getElementById('aboutLabel').textContent = siteInfo.aboutLabel;
    document.getElementById('aboutTitle').textContent = siteInfo.aboutTitle;
    document.getElementById('aboutText').innerHTML = '<p>' + siteInfo.aboutText + '</p>';
    document.getElementById('galleryLabel').textContent = siteInfo.galleryLabel;
    document.getElementById('galleryTitle').textContent = siteInfo.galleryTitle;
    document.getElementById('commLabel').textContent = siteInfo.commissionsLabel;
    document.getElementById('commTitle').textContent = siteInfo.commissionsTitle;
    document.getElementById('commDesc').textContent = siteInfo.commissionsDescription;
    document.getElementById('footerDesc').textContent = siteInfo.footerDescription;
    document.getElementById('footerBottom').innerHTML = '&copy; ' + siteInfo.copyrightYear + ' Daryl Lakey Art. All rights reserved. All paintings are original works and remain the intellectual property of the artist.';

    // Build footer social links
    const footerConnect = document.getElementById('footerConnect');
    if (siteInfo.instagramUrl) footerConnect.innerHTML += '<a href="' + siteInfo.instagramUrl + '" target="_blank">Instagram</a>';
    if (siteInfo.facebookUrl) footerConnect.innerHTML += '<a href="' + siteInfo.facebookUrl + '" target="_blank">Facebook</a>';
    if (siteInfo.emailAddress) footerConnect.innerHTML += '<a href="mailto:' + siteInfo.emailAddress + '">Email</a>';
    if (!siteInfo.instagramUrl && !siteInfo.facebookUrl && !siteInfo.emailAddress) {
        footerConnect.innerHTML += '<a href="#">Instagram</a><a href="#">Facebook</a><a href="#">Email</a>';
    }

    // ===== BUILD GALLERY FROM paintings.js =====
    const grid = document.getElementById('galleryGrid');
    paintings.forEach(function(p, index) {
        const soldClass = p.sold ? ' sold' : '';
        const soldBanner = p.sold ? '<div class="sold-banner">Sold</div>' : '';
        const cartBtnText = p.sold ? 'Sold' : 'Add to Cart';
        const cartOnclick = p.sold ? '' : 'onclick="addToCart(' + index + ')"';

        const card = document.createElement('div');
        card.className = 'painting-card' + soldClass;
        card.setAttribute('data-id', index);
        card.innerHTML =
            '<div class="painting-image-wrap">' +
                soldBanner +
                '<button class="zoom-in-btn" onclick="event.stopPropagation(); openZoom(\'' + p.image + '\')" title="Zoom in">&#x1F50D;</button>' +
                '<img src="' + p.image + '" alt="' + p.title + '" class="painting-img" loading="lazy">' +
            '</div>' +
            '<div class="painting-info">' +
                '<h3 class="painting-title">' + p.title + '</h3>' +
                '<p class="painting-size">Size unframed - ' + p.sizeUnframed + '<br>Size framed - ' + p.sizeFramed + '<br>Medium - ' + p.medium + '</p>' +
                '<p class="painting-price">£' + p.price + '</p>' +
                '<div class="painting-actions">' +
                    '<button class="btn-view" onclick="openModal(' + index + ')">View Details</button>' +
                    '<button class="btn-cart" ' + cartOnclick + '>' + cartBtnText + '</button>' +
                '</div>' +
            '</div>';
        grid.appendChild(card);
    });

    // ===== CART STATE =====
    let cart = [];

    // Navigation scroll effect
    window.addEventListener('scroll', function() {
        document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 50);
    });

    // Mobile menu
    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('open');
    }

    // Modal
    function openModal(index) {
        const p = paintings[index];
        if (!p) return;
        document.getElementById('modalImg').src = p.image;
        document.getElementById('modalImg').alt = p.title;
        document.getElementById('modalTitle').textContent = p.title;
        document.getElementById('modalSize').innerHTML = 'Size unframed - ' + p.sizeUnframed + '<br>Size framed - ' + p.sizeFramed;
        document.getElementById('modalMedium').textContent = 'Medium - ' + p.medium;
        document.getElementById('modalPrice').textContent = '£' + p.price;
        document.getElementById('modalDesc').textContent = p.description;

        // Handle sold banner in modal
        const existingBanner = document.querySelector('.modal-sold-banner');
        if (existingBanner) existingBanner.remove();

        const modalBtn = document.getElementById('modalCartBtn');
        if (p.sold) {
            const banner = document.createElement('div');
            banner.className = 'modal-sold-banner';
            banner.textContent = 'Sold';
            document.getElementById('modalImageWrap').appendChild(banner);
            modalBtn.textContent = 'Sold';
            modalBtn.className = 'modal-add-cart sold-btn';
            modalBtn.onclick = null;
        } else {
            modalBtn.textContent = 'Add to Cart';
            modalBtn.className = 'modal-add-cart';
            modalBtn.onclick = function() { addToCart(index); closeModalDirect(); };
        }

        document.getElementById('modalBackdrop').classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeModal(e) {
        if (e.target === document.getElementById('modalBackdrop')) closeModalDirect();
    }
    function closeModalDirect() {
        document.getElementById('modalBackdrop').classList.remove('active');
        document.body.style.overflow = '';
    }

    // Cart
    function addToCart(index) {
        const p = paintings[index];
        if (!p || p.sold) return;
        if (cart.find(function(item) { return item.index === index; })) {
            showToast('This painting is already in your cart');
            return;
        }
        cart.push({ index: index, title: p.title, price: p.price, image: p.image });
        updateCart();
        showToast(p.title + ' added to cart');
    }
    function removeFromCart(index) {
        cart = cart.filter(function(item) { return item.index !== index; });
        updateCart();
    }
    function updateCart() {
        const countEl = document.getElementById('cartCount');
        const itemsEl = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotal');
        countEl.textContent = cart.length;
        if (cart.length === 0) {
            itemsEl.innerHTML = '<p class="cart-empty">Your cart is empty</p>';
            totalEl.textContent = '£0';
            return;
        }
        let html = '';
        let total = 0;
        cart.forEach(function(item) {
            total += item.price;
            html +=
                '<div class="cart-item">' +
                    '<img class="cart-item-img" src="' + item.image + '" alt="' + item.title + '">' +
                    '<div class="cart-item-info">' +
                        '<div class="cart-item-title">' + item.title + '</div>' +
                        '<div class="cart-item-price">£' + item.price + '</div>' +
                    '</div>' +
                    '<button class="cart-item-remove" onclick="removeFromCart(' + item.index + ')">&times;</button>' +
                '</div>';
        });
        itemsEl.innerHTML = html;
        totalEl.textContent = '£' + total;
    }
    function toggleCart() {
        document.getElementById('cartSidebar').classList.toggle('open');
        document.getElementById('cartOverlay').classList.toggle('active');
    }
    function checkout() {
        if (cart.length === 0) { showToast('Your cart is empty'); return; }
        showToast('Checkout coming soon — please contact Daryl directly for purchases');
    }

    // Commission form
    function handleCommission(e) {
        e.preventDefault();
        showToast('Thank you! Your commission enquiry has been sent.');
        e.target.reset();
    }

    // Toast notification
    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 3000);
    }

    // Close mobile menu on link click
    document.querySelectorAll('.nav-links a').forEach(function(a) {
        a.addEventListener('click', function() { document.getElementById('navLinks').classList.remove('open'); });
    });

    // ===== ZOOM VIEWER =====
    var zoomScale = 1;
    var zoomX = 0;
    var zoomY = 0;
    var isDragging = false;
    var dragStartX, dragStartY, dragOffsetX, dragOffsetY;
    var zoomImg = document.getElementById('zoomImg');
    var zoomViewer = document.getElementById('zoomViewer');

    function openZoom(imageSrc) {
        zoomImg.src = imageSrc;
        zoomScale = 1;
        zoomViewer.classList.add('active');
        document.body.style.overflow = 'hidden';
        zoomImg.onload = function() {
            centreZoomImage();
        };
        if (zoomImg.complete) centreZoomImage();
    }

    function centreZoomImage() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var iw = zoomImg.naturalWidth;
        var ih = zoomImg.naturalHeight;
        var fitScale = Math.min(vw * 0.85 / iw, vh * 0.85 / ih);
        zoomScale = fitScale;
        zoomX = (vw - iw * zoomScale) / 2;
        zoomY = (vh - ih * zoomScale) / 2;
        applyZoomTransform();
    }

    function applyZoomTransform() {
        zoomImg.style.transform = 'translate(' + zoomX + 'px, ' + zoomY + 'px) scale(' + zoomScale + ')';
    }

    function closeZoom() {
        zoomViewer.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Scroll to zoom
    zoomViewer.addEventListener('wheel', function(e) {
        e.preventDefault();
        var rect = zoomViewer.getBoundingClientRect();
        var mouseX = e.clientX - rect.left;
        var mouseY = e.clientY - rect.top;
        var prevScale = zoomScale;
        var delta = e.deltaY > 0 ? 0.9 : 1.1;
        zoomScale = Math.max(0.2, Math.min(10, zoomScale * delta));
        zoomX = mouseX - (mouseX - zoomX) * (zoomScale / prevScale);
        zoomY = mouseY - (mouseY - zoomY) * (zoomScale / prevScale);
        applyZoomTransform();
    }, { passive: false });

    // Drag to pan
    zoomViewer.addEventListener('mousedown', function(e) {
        if (e.target === document.querySelector('.zoom-close')) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragOffsetX = zoomX;
        dragOffsetY = zoomY;
    });
    window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        zoomX = dragOffsetX + (e.clientX - dragStartX);
        zoomY = dragOffsetY + (e.clientY - dragStartY);
        applyZoomTransform();
    });
    window.addEventListener('mouseup', function() { isDragging = false; });

    // Touch support for mobile
    var lastTouchDist = 0;
    var lastTouchX = 0;
    var lastTouchY = 0;
    zoomViewer.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            dragOffsetX = zoomX;
            dragOffsetY = zoomY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            lastTouchDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
        }
    }, { passive: false });
    zoomViewer.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
            zoomX = dragOffsetX + (e.touches[0].clientX - dragStartX);
            zoomY = dragOffsetY + (e.touches[0].clientY - dragStartY);
            applyZoomTransform();
        } else if (e.touches.length === 2) {
            var dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
            var prevScale = zoomScale;
            zoomScale = Math.max(0.2, Math.min(10, zoomScale * (dist / lastTouchDist)));
            var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            zoomX = cx - (cx - zoomX) * (zoomScale / prevScale);
            zoomY = cy - (cy - zoomY) * (zoomScale / prevScale);
            lastTouchDist = dist;
            applyZoomTransform();
        }
    }, { passive: false });
    zoomViewer.addEventListener('touchend', function() { isDragging = false; });

    // Close zoom with Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (zoomViewer.classList.contains('active')) closeZoom();
            else if (document.getElementById('modalBackdrop').classList.contains('active')) closeModalDirect();
        }
    });

    // Wire up modal zoom button
    document.getElementById('modalZoomBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        var src = document.getElementById('modalImg').src;
        openZoom(src);
    });

    // ===== IMAGE PROTECTION =====
    // Disable right-click on images
    document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG' || e.target.closest('.painting-image-wrap') || e.target.closest('.modal-image-wrap') || e.target.closest('.zoom-viewer')) {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
